# 参考 galzy/.github/workflows/build-deploy.yml：
#   typecheck → 构建镜像并推送到 GHCR → 触发 Dokploy Webhook 部署。
# 镜像里是 bun build --compile 产出的单文件可执行程序（静态资源内嵌），
# 运行在 cgr.dev/chainguard/glibc-dynamic 上，健康检查由二进制自带的 --healthcheck 实现。
#
# 与参考实现的差异（都是本仓库单一应用带来的简化）：
#   - 只有一个应用，不需要 matrix 与 apps/** 路径过滤；
#   - PR 也会跑质量门禁，并在本地 load 镜像做一次容器冒烟（build 不 push）；
#   - 推送镜像用 "仓库名" 作为镜像名（ghcr.io/<owner>/<repo>），
#     标签为 package.json 版本 + 短 SHA + latest。
#
# 需要在仓库里配置：
#   Secrets:  DEPLOY_WEBHOOK                 Dokploy 服务的 Webhook URL
#   Variables: FURIN_PUBLIC_NEWAPI_DASHBOARD_URL  构建期公开变量（可留空）

name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "构建并推送镜像后触发 Dokploy 部署"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # 与 package.json 的 packageManager、Dockerfile 的镜像标签保持一致。
  BUN_VERSION: 1.4.4

jobs:
  # 只有代码/依赖/构建相关文件变化时才重新构建镜像；纯文档提交只跑质量门禁。
  changes:
    name: Detect changed paths
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'bunfig.toml'
              - 'furin.config.ts'
              - 'furin-env.d.ts'
              - 'vitest.config.ts'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/build-deploy.yml'

  quality:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      # 验收矩阵：启动 Bun 服务端包（127.0.0.1:3210）跑 38 项 HTTP/SSR/安全断言。
      # 必须放在 build 之后、编译单文件之前：--compile embed 会重建 .furin/build/bun，
      # 不再保留 server.js / client/ 目录，而 verify 需要它们。
      - name: Acceptance verification
        run: bun run verify

      # 与 Dockerfile 的构建阶段一致：验证单文件编译在 Linux 上可用。
      - name: Compile standalone binary
        run: bun run build:binary

  image:
    name: Build image
    needs: [changes, quality]
    # always() 是为了在 changes 被跳过（PR / dispatch）时仍能执行；
    # push 时只有代码相关路径变化才重新构建。
    if: ${{ always() && needs.quality.result == 'success' && (github.event_name != 'push' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve image name and tags
        id: meta
        run: |
          set -euo pipefail
          # GHCR 要求仓库名全小写。
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="$(node -p "require('./package.json').version")"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 镜像"
            echo ""
            echo "- 名称：${image}"
            echo "- 版本：${version}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PR 只在本地 load 做冒烟；main/dispatch 推送到 GHCR。
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
            FURIN_PUBLIC_NEWAPI_DASHBOARD_URL=${{ vars.FURIN_PUBLIC_NEWAPI_DASHBOARD_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 参考实现没有容器冒烟；这里在 PR 上验证镜像确实能启动并返回 SSR HTML。
      - name: Smoke test image
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker rm -f panel-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f panel-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name panel-smoke -p 3300:3000 "${IMAGE}"
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/ -o /tmp/panel.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "${ready}" != true ]; then
            echo "::error::container did not become ready"
            docker logs panel-smoke
            exit 1
          fi
          grep -q '余额面板' /tmp/panel.html
          # 静态资源必须来自二进制内嵌（furin 的 /_client/*），否则说明资源没有打进镜像。
          asset="$(grep -o '/_client/[^"]*\.css' /tmp/panel.html | head -1)"
          test -n "${asset}"
          curl -fsS -o /dev/null "http://127.0.0.1:3300${asset}"

  deploy:
    name: Trigger Dokploy deployment
    needs: [image]
    if: ${{ needs.image.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::未配置 secret DEPLOY_WEBHOOK（Dokploy 服务的 Webhook URL）"
            exit 1
          fi
          commits="${COMMITS_JSON}"
          if [ -z "${commits}" ] || [ "${commits}" = "null" ]; then
            commits='[]'
          fi
          # Dokploy 的 compose webhook 期待一个 GitHub push 事件：
          # x-github-event: push，body.ref = refs/heads/<branch>，body.commits = 变更列表。
          # 分支必须与 Dokploy 服务上配置的一致，且服务已开启 Auto Deploy。
          payload="$(jq -nc \
            --arg ref "refs/heads/${GITHUB_REF_NAME}" \
            --argjson commits "${commits}" \
            '{ ref: $ref, commits: $commits }')"
          code="$(curl -sS -o /tmp/dokploy-resp -w '%{http_code}' -X POST "${WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            --max-time 60 \
            --retry 2 \
            --retry-delay 3 \
            -d "${payload}")"
          cat /tmp/dokploy-resp || true
          if [[ "${code}" != 2* ]]; then
            echo "::error::Dokploy webhook 拒绝部署（HTTP ${code}）"
            exit 1
          fi
          echo "部署已触发：${IMAGE}:${VERSION}"

      - name: Job summary
        run: |
          {
            echo "### 部署已触发"
            echo ""
            echo "- 镜像：${{ needs.image.outputs.image }}:${{ needs.image.outputs.version }}"
            echo "- 提交：${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"